<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon-dark.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DriveEase — compare and book rental cars at airports and city locations. Transparent pricing, free cancellation on most bookings."
    />
    <meta name="theme-color" content="#2563eb" />
    <title>Travionza — JOURNEYS PERFECTLY PLANNED </title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved theme before first paint to avoid a light/dark flash -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("driveease-theme") || "{}");
          var mode = s.mode || "system";
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          if (dark) root.classList.add("dark");
          root.setAttribute("data-theme", s.palette || "ocean");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
